name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      # Neueste installierte Xcode-Version ohne Beta; Scan to me braucht das SDK von macOS 27.
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      # qpdf und libjpeg-turbo aus Quellcode zu bauen dauert einige Minuten; zwischengespeichert, solange sich das
      # Skript (Versionen und Prüfsummen) nicht ändert.
      - name: Cache qpdf
        uses: actions/cache@v6
        with:
          path: Vendor/qpdf
          key: qpdf-${{ runner.os }}-${{ hashFiles('Scripts/fetch-qpdf.sh') }}
      - name: Build qpdf
        run: ./Scripts/fetch-qpdf.sh
      - name: Run tests
        run: swift test
